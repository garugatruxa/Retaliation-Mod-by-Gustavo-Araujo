; =============================================================
;  Retaliation v1.04 - configuracao
;  (edite e reinicie o jogo para aplicar)
; =============================================================

[Points]
MaxPoints=50
KillPoints=2                ; pontos por NPC assassinado (civis, traficantes, etc.)
TheftPoints=2               ; pontos por veiculo roubado
ExplodePoints=4             ; pontos por veiculo explodido por voce
DecayAmount=5               ; pontos perdidos por ciclo
DecayIntervalSeconds=30     ; 30 segundos sem ganhar pontos
DeathPenalty=10             ; pontos perdidos ao morrer/ser preso (0 = nada)
CountHunterKills=0          ; 1 = matar cacadores gera pontos
CountCopKills=0             ; 1 = matar policia/SWAT/FBI/exercito gera pontos
CountGangKills=0            ; 1 = matar membros de gangue (Vagos, Ballas...) gera pontos
CountMissionPedKills=0      ; 1 = matar NPCs de missao gera pontos

[Wanted]
; cada 10 pontos tira 1 estrela do maximo da policia:
; 10 pts = max 4, 20 = 3, 30 = 2, 40 = 1, 50 = nao pode ser procurado
LimitWantedLevel=1
LimitDuringMissions=0       ; 0 = nao limita durante missoes (evita quebrar a historia)

[General]
PauseSpawnsOnMission=1      ; nao gera emboscadas durante missoes
ShowBlips=1                 ; marca os cacadores no radar
FirstWaveDelaySeconds=20    ; espera ate a 1a emboscada ao chegar no nivel 1
DespawnDistance=380.0
SpawnDelaySeconds=5         ; intervalo MINIMO entre cada grupo da mesma emboscada
MaxEnemies=16               ; limite total de inimigos ao mesmo tempo (chao + helicoptero)
DismountDistance=30.0       ; distancia em que os cacadores saem do carro

[Menu]
; painel de teste: comeca fechado. F8 abre/fecha.
; com o painel aberto: seta esquerda = nivel -1, seta direita = nivel +1,
; seta para cima = forca uma emboscada agora,
; seta para baixo = forca um helicoptero agora.
; (codigos de tecla virtual do Windows, em decimal: 119 = F8, 37 = esq,
;  39 = dir, 38 = cima. F5, F10 e F11 ja sao usados por outros mods seus)
Enabled=1
KeyToggleMenu=119
KeyLevelDown=37
KeyLevelUp=39
KeyForceAmbush=38
KeyForceHeli=40             ; seta para baixo = forca um helicoptero agora
ShowEventsWhenClosed=1      ; mostra avisos (+5, emboscada...) com o painel fechado

[HUD]
ShowHud=1
Scale=0.7                   ; tamanho do HUD (1.0 = tamanho original)
X=12.0                      ; tela virtual 640x448
Y=150.0

[Helicopter]
; helicoptero de mercenarios (so 1 por vez). Ele vem JUNTO com uma
; emboscada: a cada emboscada o jogo rola a chance do nivel atual
; (ChanceTierN, em %). Se cair, rola outro dado para o tipo:
;   - atiradores: piloto + 4 atiradores nos esquis (2 de cada lado)
;   - rapel: para perto de voce e 4 mercenarios descem de corda (igual a SWAT)
; matar o piloto faz o helicoptero cair e explodir
Enabled=1
ChanceTier1=5
ChanceTier2=10
ChanceTier3=15
ChanceTier4=25
ChanceTier5=50
Model=487                   ; 487 = Maverick
PedModels=117,118,120       ; Triads
Weapon=29                   ; 29 = MP5
Accuracy=70
Health=150
Armour=100
CooldownSeconds=120         ; espera ate o proximo helicoptero
RappelChance=50             ; % de ser o de rapel (o resto e o de atiradores)
RappelCount=4               ; mercenarios que descem de rapel (1 a 4)
RappelHeight=12.0           ; altura em que ele para para o rapel
OrbitRadius=22.0            ; (atiradores) raio do circulo em volta do jogador
Height=14.0                 ; (atiradores) altura acima do jogador

; -------------------------------------------------------------
; Niveis: cada nivel tem um grupo especifico de NPCs.
; Cada emboscada chega aos poucos: primeiro os grupos a pe (de 2 em 2),
; depois os carros, mais longe ainda. Os grupos sao espalhados ao longo do
; IntervalSeconds (minimo de SpawnDelaySeconds entre um e outro).
; MaxActive = limite do nivel; MaxEnemies (em [General]) = limite total.
; Armas: 22 Colt45, 23 Silenciada, 24 Deagle, 25 Shotgun, 26 Sawnoff,
;        27 Spas12, 28 Uzi, 29 MP5, 30 AK47, 31 M4, 32 Tec9, 33 Rifle
; -------------------------------------------------------------
