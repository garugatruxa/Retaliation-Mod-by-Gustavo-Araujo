; =============================================================
;  Retaliation v1.06 - configuracao
;  (edite e reinicie o jogo para aplicar)
;
;  PRESETS: copie Dificuldade.ini e/ou Desempenho.ini (pasta "Presets"
;  do download) para esta pasta. Os valores do preset substituem os daqui.
;  Sem preset, o mod roda como Dificil + PC Forte.
; =============================================================

[Points]
MaxPoints=100               ; 6 niveis (estrelas vermelhas) ate 60 pontos; 60-100 e folga
KillPoints=4                ; pontos por NPC civil assassinado (civis, traficantes, etc.)
TheftPoints=2               ; pontos por veiculo roubado
ExplodePoints=4             ; pontos por veiculo explodido por voce
DecayAmount=5               ; pontos perdidos por ciclo
DecayIntervalSeconds=45     ; 45 segundos sem ganhar pontos
ResetOnDeath=1              ; 1 = morrer/ser preso zera TODAS as estrelas vermelhas
DeathPenalty=10             ; pontos perdidos ao morrer/ser preso (0 = nada)
CountHunterKills=0          ; 1 = matar cacadores gera pontos
CopKillPoints=5             ; pontos por policial/SWAT/FBI/exercito morto (0 = nao conta)
GangKillPoints=2            ; pontos por membro de gangue morto (Vagos, Ballas...) (0 = nao conta)
CountMissionPedKills=0      ; 1 = matar NPCs de missao gera pontos

[Wanted]
; 1 = cada 10 pontos tira 1 estrela do maximo da policia
;     (10 pts = max 4, 20 = 3, 30 = 2, 40 = 1, 50 = nao pode ser procurado)
; 0 = sem limite: policia e retaliacao funcionam juntas (padrao)
LimitWantedLevel=0
LimitDuringMissions=0       ; 0 = nao limita durante missoes (evita quebrar a historia)

[General]
PauseSpawnsOnMission=1      ; nao gera emboscadas durante missoes
ShowBlips=1                 ; marca os cacadores no radar
FirstWaveDelaySeconds=20    ; espera ate a 1a emboscada ao chegar no nivel 1
DespawnDistance=380.0
SpawnDelaySeconds=5         ; intervalo MINIMO entre cada grupo da mesma emboscada
ExtraChanceFromPoints=70     ; a partir desses pontos, helicoptero e tanque ganham chance extra
ExtraChancePer10Points=10    ; +% de chance a cada 10 pontos (70 = +10, 80 = +20, 90 = +30, 100 = +40)
MaxEnemies=16               ; limite total de inimigos ao mesmo tempo (chao + helicoptero)
HunterTimeoutSeconds=150    ; inimigo que nao chegou perto do CJ nesse tempo e removido
TimeoutMinDistance=70.0     ; (so remove se ainda estiver mais longe que isso)
DismountDistance=30.0       ; distancia em que os cacadores saem do carro

[Performance]
; Protecao contra a "enxurrada" de carregadores: alguns NPCs fazem mods de
; armas soltarem dezenas de pentes de uma vez ao recarregar, derrubando o FPS.
; O mod procura montes do mesmo objeto pequeno e apaga o excesso.
MagazineFloodGuard=1
MaxSameObjectsInPile=6      ; quantos objetos iguais podem ficar juntos
PileRadius=3.0              ; raio do "monte" em metros
MaxObjectSize=0.35          ; so objetos pequenos (raio de colisao em metros)
HunterAmmo=600              ; municao dos cacadores (antes era 9999)

[Stars]
; nivel de retaliacao mostrado como estrelas VERMELHAS numa fileira logo
; abaixo das estrelas de procurado (1 estrela por nivel).
; Piscam quando vem emboscada e nos ultimos 10 s antes do MaxHeat.
; Valores calibrados num print 1920x1080 (tela virtual 640x448).
Enabled=1
SameRowAsWanted=0           ; 0 = fileira propria embaixo das estrelas da policia; 1 = mesma linha
X=620.4                     ; borda direita da 1a posicao de estrela (a da direita)
Y=82.3                      ; altura (menor = mais para cima)
StarSpacing=11.35           ; distancia entre uma estrela e a outra
RowGap=20.0                 ; (SameRowAsWanted=0) distancia para a linha de baixo
ScaleX=0.336                ; largura da estrela
ScaleY=1.62                 ; altura da estrela
Outline=0                   ; 1 = contorno preto (desligado: fica igual ao jogo)
R=222
G=0
B=0
BlinkOnAmbush=1
; imagem da estrela (retstar.txd, na pasta do mod). 0 = estrela da fonte do jogo
UseImage=1
ImageOutline=1              ; contorno preto leve na imagem
ImageX=614.0                ; centro da 1a estrela (a da direita)
ImageY=109.5                ; centro vertical da fileira (maior = mais para baixo)
ImageWidth=10.7             ; largura (10.7 = ~32 px em 1920x1080)
ImageHeight=13.3            ; altura  (13.3 = ~32 px em 1920x1080)

[MaxHeat]
; ficar SecondsAtMax segundos com MinPoints pontos ou mais
; converte a retaliacao em policia: as vermelhas piscam e viram amarelas,
; os pontos vao a 0 e o CJ fica com WantedLevel estrelas de procurado.
; Depois disso, CooldownSeconds sem contar pontos de retaliacao.
SecondsAtMax=180
MinPoints=80                ; pontos minimos para o contador de 3 minutos
WantedLevel=6
CooldownSeconds=60

[Tank]
; nivel 6 ou maior (60+ pontos): chance (%) de vir um tanque Rhino junto com
; cada emboscada (+ chance extra a partir de 70 pontos, ver [General]).
; Ele persegue o CJ e dispara projeteis do canhao mirando nele.
Chance=25
MinLevel=6
Model=432                   ; 432 = Rhino
DriverModel=287             ; 287 = soldado do exercito
FireSeconds=5               ; intervalo entre disparos
Range=110.0                 ; distancia maxima para atirar
Speed=22.0
CooldownSeconds=90          ; espera ate o proximo tanque

[Helicopter]
; helicoptero de mercenarios (so 1 por vez). Ele vem JUNTO com uma
; emboscada: a cada emboscada o jogo rola a chance do nivel atual
; (ChanceTierN, em %). Se cair, rola outro dado para o tipo:
;   - Hunter (HunterChance %): helicoptero de ataque com metralhadora e misseis
;   - atiradores: piloto + 4 atiradores nos esquis (2 de cada lado)
;   - rapel: para perto de voce e 4 mercenarios descem de corda (igual a SWAT)
; matar o piloto faz o helicoptero cair e explodir
Enabled=1
ChanceTier1=5
ChanceTier2=10
ChanceTier3=15
ChanceTier4=25
ChanceTier5=50
ChanceTier6=50
Model=487                   ; 487 = Maverick
PedModels=117,118,120       ; Triads
Weapon=29                   ; 29 = MP5
Accuracy=70
Health=150
Armour=100
CooldownSeconds=120         ; espera ate o proximo helicoptero
DoubleFromPoints=90         ; a partir desses pontos, chance de vir 2 helicopteros juntos
DoubleChance=25             ; % de chance de vir o segundo (o tipo de cada um e sorteado)
HunterChance=10             ; % de ser o Hunter
RappelChance=50             ; se nao for Hunter: % de ser o de rapel (o resto e o de atiradores)
RappelCount=4               ; mercenarios que descem de rapel (1 a 4)
RappelHeight=12.0           ; altura em que ele para para o rapel
OrbitRadius=22.0            ; (atiradores) raio do circulo em volta do jogador
Height=14.0                 ; (atiradores) altura acima do jogador
HunterModel=425
HunterOrbitRadius=45.0      ; (Hunter) raio do circulo em volta do jogador
HunterHeight=22.0
HunterGun=1                 ; metralhadora (rajadas de 12 tiros)
HunterGunDamage=8
HunterGunSpread=4.5         ; erro da mira em metros
HunterRockets=1
HunterRocketSeconds=6       ; intervalo entre misseis

; -------------------------------------------------------------
